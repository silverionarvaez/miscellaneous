<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Konveyor · Asistente de creación de targets</title>
  <style>
    :root {
      --kv-blue: #0066cc;
      --kv-blue-dark: #004080;
      --kv-navy: #151515;
      --kv-bg: #f0f0f0;
      --kv-card: #ffffff;
      --kv-border: #d2d2d2;
      --kv-text: #151515;
      --kv-muted: #6a6e73;
      --kv-green: #3e8635;
      --kv-red: #c9190b;
      --kv-yellow-bg: #fdf7e7;
      --kv-yellow-border: #f0ab00;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Red Hat Text", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--kv-bg);
      color: var(--kv-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Cabecera ---------- */
    header.masthead {
      background: var(--kv-navy);
      color: #fff;
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header.masthead .logo { font-size: 1.5rem; }
    header.masthead h1 { font-size: 1.05rem; font-weight: 500; }
    header.masthead .sub { color: #b8bbbe; font-size: 0.8rem; margin-left: auto; }

    /* ---------- Wizard ---------- */
    .wizard {
      flex: 1;
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 1fr auto;
      max-width: 1100px;
      width: 100%;
      margin: 2rem auto;
      background: var(--kv-card);
      border: 1px solid var(--kv-border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    #wizard-nav {
      grid-row: 1 / 3;
      list-style: none;
      background: #fafafa;
      border-right: 1px solid var(--kv-border);
      padding: 1.25rem 0;
    }
    .nav-step {
      display: flex; gap: 0.75rem; align-items: flex-start;
      padding: 0.8rem 1.25rem;
      opacity: 0.55;
    }
    .nav-step.current, .nav-step.done { opacity: 1; }
    .nav-step.clickable { cursor: pointer; }
    .nav-step.clickable:hover { background: #f0f4f8; }
    .nav-step.current { border-left: 3px solid var(--kv-blue); background: #eef4fb; }
    .nav-bullet {
      flex: none;
      width: 1.6rem; height: 1.6rem; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 700;
      background: var(--kv-border); color: var(--kv-text);
    }
    .nav-step.current .nav-bullet { background: var(--kv-blue); color: #fff; }
    .nav-step.done .nav-bullet { background: var(--kv-green); color: #fff; }
    .nav-text { display: flex; flex-direction: column; gap: 0.15rem; }
    .nav-title { font-weight: 600; font-size: 0.9rem; }
    .nav-subtitle { font-size: 0.75rem; color: var(--kv-muted); }

    #wizard-body { padding: 1.75rem 2rem; overflow-y: auto; }
    #wizard-body h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.4rem; }
    .hint { color: var(--kv-muted); font-size: 0.88rem; margin-bottom: 1.25rem; }
    .hint a { color: var(--kv-blue); }

    #wizard-footer {
      display: flex; justify-content: flex-end; gap: 0.75rem;
      padding: 1rem 2rem;
      border-top: 1px solid var(--kv-border);
      background: #fafafa;
    }

    /* ---------- Campos ---------- */
    .field { display: flex; flex-direction: column; gap: 0.35rem; margin-bottom: 1.2rem; }
    .field-label { font-weight: 600; font-size: 0.88rem; }
    .req { color: var(--kv-red); }
    .field-help { font-size: 0.78rem; color: var(--kv-muted); }
    .field-help code { background: #f5f5f5; padding: 0.1rem 0.35rem; border-radius: 4px; }
    input[type="text"], textarea, select {
      font: inherit;
      padding: 0.5rem 0.7rem;
      border: 1px solid var(--kv-border);
      border-radius: 4px;
      width: 100%;
    }
    input:focus, textarea:focus, select:focus {
      outline: 2px solid var(--kv-blue); outline-offset: -1px;
    }

    /* ---------- Botones y chips ---------- */
    .btn {
      font: inherit; font-weight: 600; font-size: 0.9rem;
      padding: 0.55rem 1.1rem;
      border-radius: 4px; border: 1px solid transparent;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--kv-blue); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--kv-blue-dark); }
    .btn-secondary { background: #fff; color: var(--kv-blue); border-color: var(--kv-blue); }
    .btn-secondary:hover { background: #eef4fb; }
    .btn-x {
      border: none; background: none; cursor: pointer;
      color: var(--kv-muted); font-size: 0.8rem; padding: 0 0.25rem;
    }
    .btn-x:hover { color: var(--kv-red); }

    .chip-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .chip {
      font: inherit; font-size: 0.85rem;
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--kv-border); border-radius: 999px;
      background: #fff; cursor: pointer;
    }
    .chip:hover { border-color: var(--kv-blue); }
    .chip-on { background: var(--kv-blue); border-color: var(--kv-blue); color: #fff; }
    .icon-chip { font-size: 1.2rem; padding: 0.35rem 0.65rem; }

    /* ---------- Subida de ficheros ---------- */
    .mode-toggle { display: flex; gap: 0; margin-bottom: 1.25rem; border: 1px solid var(--kv-border); border-radius: 6px; overflow: hidden; width: fit-content; }
    .mode-btn {
      font: inherit; font-size: 0.9rem; font-weight: 600;
      padding: 0.55rem 1.3rem; border: none; background: #fff; cursor: pointer;
    }
    .mode-btn + .mode-btn { border-left: 1px solid var(--kv-border); }
    .mode-on { background: var(--kv-blue); color: #fff; }

    .dropzone {
      border: 2px dashed var(--kv-border);
      border-radius: 8px;
      padding: 2rem;
      text-align: center;
      color: var(--kv-muted);
      transition: border-color 0.15s, background 0.15s;
    }
    .dropzone p { margin-bottom: 0.5rem; }
    .dropzone.drag-on { border-color: var(--kv-blue); background: #eef4fb; }

    .file-list { list-style: none; margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .file-item {
      display: flex; align-items: flex-start; gap: 0.75rem;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--kv-border); border-radius: 6px;
      background: #fafafa;
    }
    .file-item.file-bad { border-color: var(--kv-yellow-border); background: var(--kv-yellow-bg); }
    .file-meta { display: flex; flex-direction: column; gap: 0.1rem; flex: 1; }
    .file-meta small { color: var(--kv-muted); }
    .file-meta .issue { color: #795600; }

    .repo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.25rem; }
    .repo-grid .span-2 { grid-column: span 2; }

    /* ---------- Labels y sources ---------- */
    .inline-add { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }
    .inline-add input { flex: 1; }
    .label-pill {
      display: inline-flex; align-items: center; gap: 0.3rem;
      background: #eef4fb; color: var(--kv-blue-dark);
      border: 1px solid #bcd6f0;
      font-size: 0.8rem; font-family: ui-monospace, monospace;
      padding: 0.25rem 0.6rem; border-radius: 999px;
      margin: 0.1rem 0;
    }
    .label-auto { background: #f0f8f0; color: var(--kv-green); border-color: #b6d8b0; width: fit-content; }
    .source-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.4rem;
      border: 1px solid var(--kv-border); border-radius: 6px;
      padding: 0.75rem;
      max-height: 220px; overflow-y: auto;
    }
    .source-item { display: flex; gap: 0.45rem; align-items: center; font-size: 0.85rem; cursor: pointer; }

    /* ---------- Revisión ---------- */
    .review { display: grid; grid-template-columns: 160px 1fr; gap: 0.5rem 1rem; margin-bottom: 1.5rem; }
    .review dt { font-weight: 600; font-size: 0.88rem; color: var(--kv-muted); }
    .review dd { font-size: 0.92rem; }
    .code {
      background: var(--kv-navy); color: #e8e8e8;
      font-family: ui-monospace, "Cascadia Code", monospace; font-size: 0.8rem;
      padding: 1rem; border-radius: 6px;
      overflow-x: auto; max-height: 320px; overflow-y: auto;
      white-space: pre;
    }
    .alert {
      background: var(--kv-yellow-bg);
      border: 1px solid var(--kv-yellow-border);
      border-radius: 6px;
      padding: 0.7rem 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.88rem;
    }
    .success { text-align: center; padding: 1.5rem 0; }
    .success-icon { font-size: 3rem; margin-bottom: 0.75rem; }
    .success h2 { margin-bottom: 0.5rem; }
    .success p { color: var(--kv-muted); margin-bottom: 1rem; }
    .success .code { text-align: left; margin: 0 auto 1.25rem; max-width: 560px; }
    .success .btn { margin: 0 0.3rem; }

    @media (max-width: 760px) {
      .wizard { grid-template-columns: 1fr; margin: 0; border-radius: 0; }
      #wizard-nav { grid-row: auto; display: flex; overflow-x: auto; padding: 0.5rem; border-right: none; border-bottom: 1px solid var(--kv-border); }
      .nav-subtitle { display: none; }
      .repo-grid { grid-template-columns: 1fr; }
      .repo-grid .span-2 { grid-column: span 1; }
    }
  </style>
</head>
<body>
  <header class="masthead">
    <span class="logo">🎯</span>
    <h1>Konveyor — Asistente de creación de custom targets</h1>
    <span class="sub">tackle2-hub · POST /hub/targets</span>
  </header>

  <main class="wizard" aria-label="Asistente de creación de target">
    <ol id="wizard-nav"></ol>
    <section id="wizard-body"></section>
    <footer id="wizard-footer"></footer>
  </main>

  <script src="./wizard.js"></script>
</body>
</html>
